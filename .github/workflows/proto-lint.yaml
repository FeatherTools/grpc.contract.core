name: Proto Lint

on:
    #push:
    pull_request:
    schedule:
        - cron: "0 3 * * *"

jobs:
    protolint:
        name: "Proto files linting"
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6

            - name: Run protolint
              uses: plexsystems/protolint-action@v0.7.0
              with:
                  configDirectory: .protolint
